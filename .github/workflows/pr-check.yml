name: PR Check

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Markdown Links
        run: |
          npm install -g markdown-link-check
          markdown-link-check README.md

      - name: Lint basic
        run: echo "OK"
